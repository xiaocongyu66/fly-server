[package]
name = "fly-admin"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-web = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
registry = { path = "../third_party/dioxus-ui/app_crates/registry" }

[lib]
path = "src/main.rs"
