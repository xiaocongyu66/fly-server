[package]
name = "fly-admin"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-web = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Window", "Storage", "Location", "Request", "RequestInit", "Response", "Headers"] }

[lib]
path = "src/main.rs"
