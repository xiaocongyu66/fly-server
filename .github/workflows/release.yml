name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fly-admin-web
          path: web/dist/

  bundle:
    needs: [web]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bundle-${{ matrix.os }}
      - run: cargo build -p fly-server --release
      - uses: actions/download-artifact@v4
        with:
          name: fly-admin-web
          path: admin-dist
      - name: Package
        run: |
          mkdir -p pkg
          cp target/release/fly-server pkg/
          cp -r admin-dist pkg/admin-dist
          tar czf fly-server-${{ matrix.arch }}-linux.tar.gz -C pkg .
      - uses: softprops/action-gh-release@v2
        with:
          files: fly-server-${{ matrix.arch }}-linux.tar.gz
