name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fly-admin-web
          path: web/dist/

  bundle:
    needs: [web]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fly-server-x86_64-linux.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: fly-server-aarch64-linux.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: fly-server-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: fly-server-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bundle-${{ matrix.target }}
      - run: cargo build -p fly-server --release --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: fly-admin-web
          path: admin-dist
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/fly-server pkg/
          cp -r admin-dist pkg/admin-dist
          tar czf ${{ matrix.artifact }} -C pkg .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/fly-server.exe pkg/
          Copy-Item -Recurse admin-dist pkg/admin-dist
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.artifact }}
      - name: Checksum (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          f="${{ matrix.artifact }}"
          case "$(uname -s)" in
            Darwin)
              md5=$(md5 -q "$f")
              sha=$(shasum -a 256 "$f" | awk '{print $1}')
              ;;
            *)
              md5=$(md5sum "$f" | awk '{print $1}')
              sha=$(sha256sum "$f" | awk '{print $1}')
              ;;
          esac
          printf '%s  %s\n' "$md5" "$f" > "$f.md5"
          printf '%s  %s\n' "$sha" "$f" > "$f.sha256"
      - name: Checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = "${{ matrix.artifact }}"
          $h = (Get-FileHash $f -Algorithm MD5).Hash.ToLower()
          $s = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  $f" | Out-File -NoNewline -Encoding ascii "$f.md5"
          "`n" | Out-File -Append -NoNewline -Encoding ascii "$f.md5"
          "$s  $f" | Out-File -NoNewline -Encoding ascii "$f.sha256"
          "`n" | Out-File -Append -NoNewline -Encoding ascii "$f.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.md5
            ${{ matrix.artifact }}.sha256
