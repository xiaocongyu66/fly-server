name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  server:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check -p fly-server
      - run: cargo clippy -p fly-server --all-targets -- -D warnings
      - run: cargo test -p fly-server --release

  web:
    # x86_64 only: dx downloads wasm-bindgen-cli which has no aarch64-linux
    # official release; the wasm artifact itself is platform-independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dx
        run: |
          curl -sL -o /tmp/dx.tar.gz \
            https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-x86_64-unknown-linux-gnu.tar.gz
          tar xzf /tmp/dx.tar.gz -C /usr/local/bin
          dx --version
      - name: Tailwind CSS
        working-directory: web
        run: |
          npm install
          npx @tailwindcss/cli -i tailwind.css -o assets/main.css --minify
          mkdir -p public/assets
          cp assets/main.css public/assets/main.css
      - name: dx build (wasm)
        working-directory: web
        run: dx build --platform web --release
      - uses: actions/upload-artifact@v4
        with:
          name: fly-admin-web
          path: target/dx/fly-admin/release/web/public/

  bundle:
    # Full self-contained package per architecture: fly-server binary +
    # web admin dist. Needs both server (that arch) and web jobs first.
    needs: [server, web]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.os }}
      - name: Build server (release)
        run: cargo build -p fly-server --release
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: fly-admin-web
          path: admin-dist
      - name: Package
        run: |
          mkdir -p pkg
          cp target/release/fly-server pkg/
          cp -r admin-dist pkg/admin-dist
          cp README.md pkg/ 2>/dev/null || true
          tar czf fly-server-${{ matrix.arch }}-linux.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: fly-server-${{ matrix.arch }}-linux
          path: fly-server-${{ matrix.arch }}-linux.tar.gz
