name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  server:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check -p fly-server
      - run: cargo clippy -p fly-server --all-targets -- -D warnings
      - run: cargo test -p fly-server --release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fly-admin-web
          path: web/dist/

  bundle:
    needs: [server, web]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.os }}
      - run: cargo build -p fly-server --release
      - uses: actions/download-artifact@v4
        with:
          name: fly-admin-web
          path: admin-dist
      - name: Package
        run: |
          mkdir -p pkg
          cp target/release/fly-server pkg/
          cp -r admin-dist pkg/admin-dist
          tar czf fly-server-${{ matrix.arch }}-linux.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: fly-server-${{ matrix.arch }}-linux
          path: fly-server-${{ matrix.arch }}-linux.tar.gz
