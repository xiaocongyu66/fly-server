[package]
name = "fly-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenAI-style API server for connectome-driven LIF fly-brain simulation with post-training slots"

[lib]
name = "fly_server"
path = "src/lib.rs"

[[bin]]
name = "fly-server"
path = "src/main.rs"

[dependencies]
flate2 = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[profile.release]
codegen-units = 1
lto = "thin"
incremental = false
