[workspace]
# `web/` is a pure npm/Vite project (the Dioxus rust crate was abandoned —
# wasm-bindgen has no linux-aarch64 release) and must not be a member.
exclude = ["web", "third_party/dioxus-ui"]
resolver = "2"

[package]
name = "fly-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenAI-style API server for connectome-driven LIF fly-brain simulation with post-training slots"

[lib]
name = "fly_server"
path = "src/lib.rs"

[[bin]]
name = "fly-server"
path = "src/main.rs"

[dependencies]
flate2 = "1"
getrandom = "0.2"
lz4_flex = "0.11"
md-5 = "0.10"
pollster = { version = "0.4", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
ureq = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
wgpu = { version = "24", optional = true }
bytemuck = { version = "1", features = ["derive"] }
libloading = { version = "0.8", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
incremental = false

[features]
gpu = ["dep:wgpu", "dep:pollster"]
cuda = ["dep:libloading"]
